</style></head><body><div id="menu"><div class="panel"><h1>⛳ Open Golf</h1><p>Choose your controls manually. No automatic detection.</p><button class="choice" data-mode="mobile">📱 Google App / Phone — Touch</button><button class="choice alt" data-mode="pc">🖥️ PC Browser — Mouse &amp; Keyboard</button><p style="font-size:12px">The Google app on iPhone uses Apple's browser engine. Mobile support depends on browser WebAssembly compatibility.</p></div></div><iframe id="game" title="Open Golf game" allow="fullscreen" allowfullscreen></iframe><div id="toolbar"><button id="controlsBtn">⚙ Controls</button><button id="fullBtn">⛶ Fullscreen</button></div><div id="help"><strong>Controls</strong><p id="helpText"></p><button id="switchBtn">Change device</button><button id="closeBtn">Close</button></div><div id="mobileHint">Drag on the game to aim • Tap to interact</div><script src="controls.js"></script></body></html>
